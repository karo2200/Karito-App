overwrite: true
schema: "https://dev-api8081.karito.net/graphql"
hooks:
  afterAllFileWrite:
    - prettier --write
documents: "graphql/**/*.gql"
generates:
  generated/graphql.tsx:
    plugins:
      - typescript
      - typescript-operations
      - typescript-react-query
    config:
      addInfiniteQuery: true
      reactQueryVersion: "5"
      addSuspeneQuery: true
      fetcher:
        func: "@/graphql/fetcher#fetcher"
