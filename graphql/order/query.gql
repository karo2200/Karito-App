query serviceRequest_getById($input: GetServiceRequestByIdInput!) {
  serviceRequest_getById(input: $input) {
    result {
      address {
        text
        city {
          name
          id
        }
      }
      finalPrice
      basePrice
      discountAmount
      trackingCode
      customer {
        firstName
        lastName
        phoneNumber
        profileImageUrl
        id
        gender
      }
      description
      requestDate
      id
      serviceType {
        name
        id
        logo
      }
      specialist {
        lastName
        firstName
        id
        profileImageUrl
        rateCount
        phoneNumber
        successfulMissions
      }
      status
    }
    status
  }
}

