query serviceRequest_getMyRequests(
  $skip: Int
  $take: Int
  $where: ServiceRequestDtoFilterInput
  $order: [ServiceRequestDtoSortInput!]
) {
  serviceRequest_getMyRequests {
    result(skip: $skip, take: $take, where: $where, order: $order) {
      items {
        address {
          text
        }
        basePrice
        finalPrice
        customer {
          lastName
          firstName
          phoneNumber
        }
        description
        id
        requestDate
        status
        serviceType {
          name
          id
        }
        specialist {
          lastName
          firstName
          id
          profileImageUrl
        }
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
      }
      totalCount
    }
    status
  }
}

