query specialist_getMyProfile {
  specialist_getMyProfile {
    status
    result {
      city {
        id
        name
        province {
          id
          name
        }
      }
      averageRating
      rateCount
      birthDate
      id
      firstName
      lastName
      gender
      nationalCode
      profileImageUrl
      idCardImageUrl
      daysRegistered
      phoneNumber
      successfulMissions
      idCardVerificationStatus
      identityVerificationVideoStatus
      identityVerificationVideoUrl
      serviceSubCategory {
        id
        logo
        name
        serviceCategory {
          id
          logo
          name
        }
      }
      serviceTypes {
        id
        logo
        name
      }
      specializedDocumentsVerificationStatus
      specializedDocumentUrls
    }
  }
}

