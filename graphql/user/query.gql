query address_getAddressById($input: GetAddressByIdInput!) {
  address_getAddressById(input: $input) {
    result {
      id
      latitude
      longitude
      isPrimary
      floorNumber
      buildingNumber
      unitNumber
      city {
        name
        id
      }
      text
    }
  }
}
