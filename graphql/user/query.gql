query user_getMyProfile {
  user_getMyProfile {
    status
    result {
      id
      phoneNumber
      firstName
      gender
      lastName
      profileImageUrl
    }
  }
}

query address_getMyAddresses(
  $skip: Int
  $take: Int
  $where: AddressDtoFilterInput
  $order: [AddressDtoSortInput!]
) {
  address_getMyAddresses {
    result(skip: $skip, take: $take, where: $where, order: $order) {
      items {
        id
        latitude
        longitude
        isPrimary
        floorNumber
        buildingNumber
        unitNumber
        title
        city {
          name
          id
        }
        text
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
      }
    }
    status
  }
}

