query city_getAvailableServiceCategories(
  $input: GetAvailableServiceCategoriesForCityInput!
  $skip: Int
  $take: Int
  $where: ServiceCategoryDtoFilterInput
  $order: [ServiceCategoryDtoSortInput!]
) {
  city_getAvailableServiceCategories(input: $input) {
    result(skip: $skip, take: $take, where: $where, order: $order) {
      items {
        name
        logo
        id
      }
      pageInfo {
        hasNextPage
        hasPreviousPage
      }
    }
    status
  }
}

query city_getAvailableServiceSubCategories(
  $input: GetAvailableServiceSubCategoriesForCityInput!
  $skip: Int
  $take: Int
  $order: [ServiceSubCategoryDtoSortInput!]
  $where: ServiceSubCategoryDtoFilterInput
) {
  city_getAvailableServiceSubCategories(input: $input) {
    result(skip: $skip, take: $take, order: $order, where: $where) {
      pageInfo {
        hasNextPage
        hasPreviousPage
      }
      items {
        id
        logo
        name
        serviceCategory {
          id
          name
        }
      }
    }
    status
  }
}
